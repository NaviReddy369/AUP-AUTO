<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Classes – AUP Auto</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <nav id="nav"></nav>
  <main>
    <h1>Classes</h1>
    <p class="sub"><code>SELECT * FROM Class ORDERBY Name</code> – classes are optional tags used to segment transactions</p>
    <div id="error" hidden></div>
    <div class="toolbar"><button id="rawBtn" hidden>Show raw JSON</button></div>
    <pre id="raw" hidden></pre>
    <div id="content"></div>
  </main>
  <script src="/app.js"></script>
  <script>
    loadTablePage('/api/classes', [
      { key: 'name', label: 'Name' },
      { key: 'subClass', label: 'Sub-class', format: fmt.bool },
      { key: 'active', label: 'Active', format: fmt.bool },
    ]);
  </script>
</body>
</html>
